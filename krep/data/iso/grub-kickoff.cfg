set default=0
set timeout=10
# Load EFI video drivers. This device is EFI so keep the
# video mode while booting the linux kernel.
insmod efi_gop
insmod font
if loadfont /boot/grub/fonts/unicode.pf2
then
        insmod gfxterm
        set gfxmode=auto
        set gfxpayload=keep
        terminal_output gfxterm
fi

# kickoff live layout: the rootfs is LiveOS/rootfs.squashfs, mounted by the
# initramfs init through a loop device and overlayed with a tmpfs upper layer.
# No rd.live.image and no rw: dracut's live setup does not run here, and the
# overlay is what provides writability. root=LABEL names the ISO9660 volume
# identifier rather than a partition label.
menuentry 'Kreato Linux' --class os {
    insmod gzio
    insmod part_msdos
    linux /boot/vmlinuz root=LABEL=ISOIMAGE init=@INIT@
    initrd /boot/initramfs.img
}
