# Repository-wide compiler configuration.
#
# jumpstartcore (libs/jumpstartcore) is the reusable core library shared by the
# Jumpstart daemon and external core implementations.  Nim reads this file for
# every project file below the repository root, so the daemon, jumpctl,
# kongue-runner, the tests and editor tooling all resolve `import jumpstartcore/...`
# without per-command flags.  `$config` is this file's directory.
--path:"$config/libs/jumpstartcore/src"
