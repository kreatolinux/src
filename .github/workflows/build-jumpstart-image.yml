name: Build Jumpstart USB image

# Assembles a bootable disk image (.img) with krep: a GPT layout containing a
# read-only EROFS root partition plus a FAT32 ESP holding GRUB, the kernel and
# the initramfs, so the image boots via UEFI and can be written to a USB stick
# with dd.
#
# This runs inside the Kreato builder image, the same environment every other
# CI job uses, and gets kpkg from the artifacts published by build.yml. The
# image toolchain (erofs-utils, gptfdisk, dosfstools, mtools, grub) is installed
# as Kreato packages rather than through the host distribution, so the build
# exercises the same stack a Kreato system would use.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: false
        default: 'both'
        type: choice
        options: [x86_64, arm64, both]
      buildType:
        description: 'Rootfs profile to base the image on'
        required: false
        default: 'jumpstart-image'
      publish:
        description: 'Attach the compressed image to a GitHub release'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 4 * * MON'

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 350
    container:
      image: ${{ matrix.arch == 'arm64' && 'ghcr.io/kreatolinux/builder:aarch64' || 'ghcr.io/kreatolinux/builder:latest' }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.arch == 'both' && '["x86_64", "arm64"]' || format('["{0}"]', inputs.arch || 'x86_64')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get latest workflow run
        id: get-run-id
        run: |
          # kpkg comes from build.yml. Use the default job token: GH_PAT is a
          # kpkg-repo secret and is not defined in this repository, so the
          # request would be unauthenticated and fail every retry.
          for i in 1 2 3 4 5; do
            LATEST_RUN_ID=$(curl -s --fail -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/kreatolinux/src/actions/workflows/build.yml/runs?per_page=20" \
              | awk '/"id":/ { match($0, /[0-9]+/); lastid=substr($0, RSTART, RLENGTH) }
                     /"conclusion": "success"/ { print lastid; exit }') && [ -n "$LATEST_RUN_ID" ] && break
            echo "lookup attempt $i failed, retrying..."
            sleep 5
          done
          if [ -z "${LATEST_RUN_ID:-}" ]; then
            echo "::warning::no successful build.yml run found; kpkg will be built from source"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.get-run-id.outputs.run_id != ''
        with:
          # Match the job's architecture: build.yml publishes separate
          # amd64 and arm64 binaries, and an arm64 job cannot execute an
          # x86_64 one (it fails as a shell syntax error).
          name: kpkg-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}-linux-release
          path: /tmp/kpkg-bin
          github-token: ${{ github.token }}
          repository: kreatolinux/src
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: Build kpkg from source if no artifact was available
        if: steps.get-run-id.outputs.run_id == ''
        run: |
          set -euo pipefail
          nimble install -y cligen fuzzy nimcrypto norm regex || true
          mkdir -p /tmp/kpkg-bin
          nim c --deepcopy:on -d:release -d:useDist --passL:-larchive \
            --threads:on -d:ver=8.0.0 -d:ssl -o=/tmp/kpkg-bin/kpkg kpkg/kpkg.nim

      - name: Point the repositories at this checkout
        run: |
          set -euo pipefail
          chmod +x /tmp/kpkg-bin/kpkg
          KPKG=/tmp/kpkg-bin/kpkg

          # The builder image ships a config pointing at the published
          # repositories. This workflow builds an *image from* packages, not
          # the packages themselves, so use the published repositories rather
          # than the checkout: $GITHUB_WORKSPACE is this source tree and holds
          # no package recipes.
          mkdir -p /etc/kpkg/repos
          # bin.krea.to serves the same layout as mirror.krea.to but with no
          # CDN in front. The mirror caches negative responses, so a package
          # uploaded minutes ago (or just rebuilt) can 404 for up to an hour
          # even though the object is present. That produced several bogus
          # "package does not exist" failures here.
          "$KPKG" repl -a "set config.Repositories.binRepos bin.krea.to"
          "$KPKG" repl -a "set config.Upgrade.buildByDefault no"
          "$KPKG" update
          "$KPKG" --version

      - name: Install the image toolchain as Kreato packages
        run: |
          set -euo pipefail
          KPKG=/tmp/kpkg-bin/kpkg
          # krep disk needs:
          #   base:            cp truncate mkfs.erofs sgdisk dd
          #   with bootloader: mkfs.vfat mcopy grub-mkstandalone
          # plus an initramfs generator.
          "$KPKG" install -y erofs-utils gptfdisk dosfstools mtools grub \
            e2fsprogs util-linux kmod booster
          for t in mkfs.erofs sgdisk mkfs.vfat mcopy grub-mkstandalone depmod booster; do
            printf '%-18s' "$t"
            command -v "$t" || { echo "MISSING after install"; exit 1; }
          done

      - name: Build krep
        run: |
          set -euo pipefail
          nimble install -y cligen fuzzy nimcrypto norm regex || true
          mkdir -p out
          nim c -d:branch=master --deepcopy:on --passL:-larchive \
            --threads=on -d:ssl -o=out/krep krep/krep.nim
          ./out/krep disk --help >/dev/null

      - name: Stage rootfs with kernel and initramfs
        id: rootfs
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          PROFILE="${{ inputs.buildType }}"
          CFG="krep/data/rootfs/arch/${ARCH}/configs/${PROFILE}.kg"

          if [ ! -f "$CFG" ]; then
            echo "::error::profile $CFG not found"
            exit 1
          fi
          # The stock profiles carry no kernel, but the disk builder requires
          # /boot/vmlinuz-<version> and /usr/lib/modules/<version>.
          grep -q '"linux"' "$CFG" || {
            echo "::error::$CFG must list \"linux\" in extra_packages to be bootable"
            exit 1
          }

          mkdir -p /var/cache/kpkg/archives /var/cache/kpkg/sources
          # The profile's build_directory is /out; make sure it exists on a
          # real filesystem before staging rather than relying on krep to
          # create it implicitly.
          mkdir -p /out

          ./out/krep rootfs \
            --buildType="$PROFILE" \
            --arch="$ARCH" \
            --dataDir="krep/data"

          # Fail here with a clear message instead of a confusing kernel lookup
          # failure in the disk builder.
          test -d /out || { echo "::error::krep did not create /out"; exit 1; }
          test -n "$(ls -A /out)" || { echo "::error::/out is empty after staging"; exit 1; }
          echo "staged rootfs: $(du -sh /out | cut -f1)"

      - name: Assemble bootable disk image
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          OUT="$GITHUB_WORKSPACE/images"
          mkdir -p "$OUT"
          echo "=== filesystems ==="
          df -h / "$OUT" /tmp /out 2>/dev/null || true
          echo "=== rootfs size ==="
          du -sh /out 2>/dev/null || echo "/out missing"
          echo "=== free inodes ==="
          df -i / | tail -1

          # krep builds the intermediate EROFS and disk.img under its
          # workspace, which defaults to /tmp. Keep everything on the large
          # runner disk instead: dd failed with ENOSPC while df / showed
          # 107 GB free, because the work happened on a different filesystem.
          WORK="$GITHUB_WORKSPACE/.krep-work"
          mkdir -p "$WORK"

          # --clearRootPassword: this is a throwaway live image, so root
          # logs in with no password on purpose. Without the flag the image
          # ships whatever hash the base rootfs carries, which is not a
          # usable one (the overlay's /etc/passwd placeholder).
          ./out/krep disk \
            --rootfs="/out" \
            --output="$OUT" \
            --workDir="$WORK" \
            --bootloader=grub \
            --arch="$ARCH" \
            --espSizeMiB=256 \
            --initramfsGenerator=booster \
            --clearRootPassword \
            --overwrite

          ls -lh "$OUT"

      - name: Verify the image has an ESP and a root partition
        run: |
          set -euo pipefail
          IMG=$(ls "$GITHUB_WORKSPACE"/images/*.img | head -1)
          echo "image: $IMG"
          sgdisk -p "$IMG"
          sgdisk -p "$IMG" | grep -qiE 'EF00|efi' || {
            echo "::error::no EFI system partition in $IMG"; exit 1; }
          sgdisk -p "$IMG" | grep -qiE 'jsroot' || {
            echo "::error::no root partition in $IMG"; exit 1; }

      - name: Compress
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/images"
          for f in *.img; do zstd -19 -T0 "$f" -o "$f.zst"; done
          ls -lh

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: jumpstart-image-${{ matrix.arch }}
          # Relative: in container jobs github.workspace is the *host* path
          # (/home/runner/...) while the action resolves against the container
          # mount (/__w/...), so an absolute path matches nothing.
          path: images/*.img.zst
          if-no-files-found: error
          retention-days: 30
