name: Build rootfs

on:
  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:
    inputs:
      arm64Only:
        description: "Only run the arm64 leg (skip amd64)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    if: ${{ !inputs.arm64Only }}
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/kreatolinux/builder:latest
        options: --privileged
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Update cache on every commit
        uses: actions/cache@v5
        with:
          path: /var/cache/kpkg/archives
          key: binary-cache-${{ github.run_id }}
          restore-keys: |
            binary-cache

      - name: Build nocc rootfs tarball
        run: |
          IS_ACTIONS=y sh $GITHUB_WORKSPACE/scripts/build-ci.sh init
          IS_ACTIONS=y sh $GITHUB_WORKSPACE/scripts/build-ci.sh build nocc

      - name: Upload nocc Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: nocc-rootfs
          path: ${{ github.workspace }}/kreato-linux-nocc-*.tar.gz
          if-no-files-found: error

      - name: Build builder rootfs tarball
        run: |
          IS_ACTIONS=y sh $GITHUB_WORKSPACE/scripts/build-ci.sh build builder

      - name: Upload Builder Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: builder-rootfs
          path: ${{ github.workspace }}/kreato-linux-builder-*.tar.gz
          if-no-files-found: error

      - name: Build builder-gnu rootfs tarball
        run: |
          IS_ACTIONS=y sh $GITHUB_WORKSPACE/scripts/build-ci.sh build builder-gnu

      - name: Upload builder-gnu Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: builder-gnu-rootfs
          path: ${{ github.workspace }}/kreato-linux-builder-gnu-*.tar.gz
          if-no-files-found: error

      - name: Build builder-repo rootfs tarball
        run: |
          IS_ACTIONS=y sh $GITHUB_WORKSPACE/scripts/build-ci.sh build builder-repo

      - name: Upload builder-repo Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: builder-repo-rootfs
          path: ${{ github.workspace }}/kreato-linux-builder-repo-*.tar.gz
          if-no-files-found: error

  # aarch64 builder rootfs: built inside the aarch64 builder container itself
  # (self-hosting). The container's kpkg-repo clone is reset to origin/master
  # so it always carries the current runfiles.
  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    container:
        image: ghcr.io/kreatolinux/builder:aarch64
        options: --privileged
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Update cache on every commit
        uses: actions/cache@v5
        with:
          path: /var/cache/kpkg/archives
          key: binary-cache-aarch64-${{ github.run_id }}
          restore-keys: |
            binary-cache-aarch64

      - name: Init and build the builder rootfs tarball
        run: |
          set -x
          rm -rf /work && ln -s $GITHUB_WORKSPACE /work
          git config --global --add safe.directory /__w/src/src
          mkdir /out
          ln -s /out /work/out
          cd /work
          export KPKG_ENABLE_DEBUG=yes

          # Install nimble deps (needed for krep build)
          ./build.sh -i

          kpkg
          # Use the master branch of kpkg-repo (stable lacks the aarch64 fixes)
          sed -i s/stable/master/g /etc/kpkg/kpkg.conf
          kpkg repl -a "set config.Upgrade.buildByDefault no"
          # Wipe the old repos and re-clone from master (has aarch64 fixes)
          rm -rf /etc/kpkg/repos/main /etc/kpkg/repos/lockin
          kpkg update
          # kpkg now performs bounded, resumable downloads itself.
          nim c -d:branch=master --deepcopy:on --passL:-larchive --passC:-no-pie \
              --threads:on -d:ssl -o=krep/krep krep/krep.nim

          # Binary assembly does not compile packages or bypass the sandbox.
          # Keep the checked-in config's source-build default for local users.
          sed -i 's/^BuildPackages=yes$/BuildPackages=no/' krep/data/rootfs/arch/arm64/configs/builder.conf
          ./krep/krep rootfs --dataDir=/work/krep/data/rootfs --buildType=builder --arch=arm64

          cd /out
          tar -czf /work/kreato-linux-builder-aarch64-$(date +%d-%m-%Y).tar.gz --numeric-owner .

      - name: Upload aarch64 Builder Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: builder-rootfs-aarch64
          path: ${{ github.workspace }}/kreato-linux-builder-aarch64-*.tar.gz
          if-no-files-found: error

  docker:
    if: ${{ !inputs.arm64Only }}
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts from build job
        uses: actions/download-artifact@v8

      - name: Prepare for Docker
        run: |
            mkdir /tmp/docker.tmp /tmp/docker.tmp.nocc /tmp/docker.tmp.builder-gnu /tmp/docker.tmp.builder-repo
            cp $GITHUB_WORKSPACE/docker/Dockerfile /tmp/docker.tmp.nocc || exit 1
            cp $GITHUB_WORKSPACE/docker/Dockerfile /tmp/docker.tmp/ || exit 1
            cp $GITHUB_WORKSPACE/docker/Dockerfile /tmp/docker.tmp.builder-gnu || exit 1
            cp $GITHUB_WORKSPACE/docker/Dockerfile /tmp/docker.tmp.builder-repo || exit 1
            tar -xvpf $GITHUB_WORKSPACE/builder-gnu-rootfs/kreato-linux-builder-gnu-*.tar.gz -C "/tmp/docker.tmp.builder-gnu"
            tar -xvpf $GITHUB_WORKSPACE/builder-repo-rootfs/kreato-linux-builder-repo-*.tar.gz -C "/tmp/docker.tmp.builder-repo"
            tar -xvpf $GITHUB_WORKSPACE/builder-rootfs/kreato-linux-builder-*.tar.gz -C "/tmp/docker.tmp"
            tar -xvpf $GITHUB_WORKSPACE/nocc-rootfs/kreato-linux-nocc-*.tar.gz -C "/tmp/docker.tmp.nocc"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub and Forgejo Packages
        run: |
          echo $CR_PAT | docker login ghcr.io -u kreatolinux --password-stdin
        env:
          CR_PAT: ${{ secrets.CR_PAT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push builder image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp
          push: true
          tags: kreato/builder:latest ,ghcr.io/kreatolinux/builder:latest

      - name: Remove builder image
        run: |
          sudo rm -rf /tmp/docker.tmp
          sudo docker rmi ghcr.io/kreatolinux/builder kreato/builder -f

      - name: Build and push nocc image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.nocc
          push: true
          tags: kreato/linux:latest,ghcr.io/kreatolinux/nocc:latest

      - name: Remove nocc image
        run: |
          sudo rm -rf /tmp/docker.tmp.nocc
          sudo docker rmi ghcr.io/kreatolinux/nocc kreato/linux -f

      - name: Build and push builder-repo image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.builder-repo
          push: true
          tags: kreato/builder-repo:latest,ghcr.io/kreatolinux/builder-repo:latest

      - name: Build and push builder-gnu image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.builder-gnu
          push: true
          tags: kreato/builder-gnu:latest,ghcr.io/kreatolinux/builder-gnu:latest

  # Multiarch builder image: amd64 rootfs from the build job above, aarch64
  # rootfs from build-arm64. One manifest on ghcr.io/kreatolinux/builder:latest.
  # Also runs on arm64-only dispatches: the published linux/amd64 image is
  # merged with the freshly built aarch64 image, refreshing both :aarch64
  # and :latest without rebuilding the x86_64 rootfs.
  docker-multiarch:
    needs: [build, build-arm64]
    if: ${{ !cancelled() && needs.build-arm64.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download aarch64 rootfs
        uses: actions/download-artifact@v8
        with:
          name: builder-rootfs-aarch64
          path: /tmp/rootfs-aarch64

      - name: Prepare aarch64 image context
        run: |
          mkdir -p /tmp/docker.tmp.aarch64
          cp $GITHUB_WORKSPACE/docker/Dockerfile /tmp/docker.tmp.aarch64/
          # The uploaded artifact keeps the dated filename produced by the build step.
          tar -xpf /tmp/rootfs-aarch64/kreato-linux-builder-aarch64-*.tar.gz -C /tmp/docker.tmp.aarch64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN lacks write access to the existing kreatolinux/builder
      # ghcr package; the docker job has always pushed with CR_PAT.
      - name: Login to ghcr.io
        run: |
          echo $CR_PAT | docker login ghcr.io -u kreatolinux --password-stdin
        env:
          CR_PAT: ${{ secrets.CR_PAT }}

      - name: Push aarch64 builder image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.aarch64
          push: true
          tags: ghcr.io/kreatolinux/builder:aarch64

      - name: Create and push the multiarch manifest
        run: |
          set -euo pipefail
          # The published :latest is either a plain amd64 image (freshly
          # pushed by the docker job on full runs) or a manifest list from an
          # earlier multiarch run. Resolve the actual linux/amd64 image so
          # :latest keeps working x86_64 support after this update.
          docker manifest inspect ghcr.io/kreatolinux/builder:latest > /tmp/latest.json
          AMD64_REF=$(jq -r 'if .manifests then ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | "ghcr.io/kreatolinux/builder@" + .digest] | .[0]) else "ghcr.io/kreatolinux/builder:latest" end' /tmp/latest.json)
          echo "amd64 source: $AMD64_REF"
          docker manifest create ghcr.io/kreatolinux/builder:latest \
            --amend "$AMD64_REF" \
            --amend ghcr.io/kreatolinux/builder:aarch64
          docker manifest inspect ghcr.io/kreatolinux/builder:latest
          docker manifest push ghcr.io/kreatolinux/builder:latest
