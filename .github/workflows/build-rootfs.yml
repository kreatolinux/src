name: Build rootfs

on:
  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:
    inputs:
      arm64Only:
        description: "Only run the arm64 leg (skip amd64)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    name: build (${{ matrix.arch }}, ${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(inputs.arm64Only && '["arm64"]' || '["amd64", "arm64"]') }}
        image: [nocc, builder, builder-gnu, builder-repo, builder-systemd]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 350
    container:
      image: ghcr.io/kreatolinux/builder:${{ matrix.arch == 'arm64' && 'aarch64' || 'latest' }}
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update cache on every commit
        uses: actions/cache@v5
        with:
          path: /var/cache/kpkg/archives
          key: binary-cache-${{ matrix.arch }}-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: |
            binary-cache-${{ matrix.arch }}-

      - name: Init and build AMD64 rootfs
        if: matrix.arch == 'amd64'
        run: |
          IS_ACTIONS=y sh "$GITHUB_WORKSPACE/scripts/build-ci.sh" init
          IS_ACTIONS=y sh "$GITHUB_WORKSPACE/scripts/build-ci.sh" build "${{ matrix.image }}" amd64

      - name: Init and build ARM64 rootfs
        if: matrix.arch == 'arm64'
        run: |
          set -x
          rm -rf /work && ln -s $GITHUB_WORKSPACE /work
          git config --global --add safe.directory /__w/src/src
          mkdir /out
          ln -s /out /work/out
          cd /work
          export KPKG_ENABLE_DEBUG=yes

          # Install nimble deps (needed for krep build)
          ./build.sh -i

          kpkg
          # Use the master branch of kpkg-repo (stable lacks the aarch64 fixes)
          sed -i s/stable/master/g /etc/kpkg/kpkg.conf
          kpkg repl -a "set config.Upgrade.buildByDefault no"
          # Wipe the old repos and re-clone from master (has aarch64 fixes)
          rm -rf /etc/kpkg/repos/main /etc/kpkg/repos/lockin
          kpkg update
          # kpkg now performs bounded, resumable downloads itself.
          nim c -d:branch=master --deepcopy:on --passL:-larchive --passC:-no-pie \
              --threads:on -d:ssl -o=krep/krep krep/krep.nim

          ./krep/krep rootfs --dataDir=/work/krep/data/rootfs --buildType=${{ matrix.image }} --arch=arm64

          cd /out
          tar -czf /work/kreato-linux-${{ matrix.image }}-aarch64-$(date +%d-%m-%Y).tar.gz --numeric-owner .

      - name: Upload ${{ matrix.arch }} ${{ matrix.image }} Rootfs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-rootfs-${{ matrix.arch }}
          path: ${{ github.workspace }}/kreato-linux-${{ matrix.image }}-${{ matrix.arch == 'arm64' && 'aarch64-*.tar.gz' || 'glibc-*-amd64.tar.gz' }}
          if-no-files-found: error

  # Publish both architectures and merge :latest in one job per image.
  # ARM64-only runs retain the already-published AMD64 image.
  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: builder
            dockerhub: builder
          - image: nocc
            dockerhub: linux
          - image: builder-gnu
            dockerhub: builder-gnu
          - image: builder-repo
            dockerhub: builder-repo
          - image: builder-systemd
            dockerhub: builder-systemd
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download amd64 rootfs
        if: ${{ !inputs.arm64Only }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.image }}-rootfs-amd64
          path: /tmp/rootfs-amd64

      - name: Prepare amd64 image context
        if: ${{ !inputs.arm64Only }}
        run: |
          mkdir -p /tmp/docker.tmp.amd64
          cp "$GITHUB_WORKSPACE/docker/Dockerfile" /tmp/docker.tmp.amd64/
          sudo tar -xpf /tmp/rootfs-amd64/kreato-linux-${{ matrix.image }}-glibc-*-amd64.tar.gz -C /tmp/docker.tmp.amd64

      - name: Download aarch64 rootfs
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.image }}-rootfs-arm64
          path: /tmp/rootfs-aarch64

      - name: Prepare aarch64 image context
        run: |
          mkdir -p /tmp/docker.tmp.aarch64
          cp "$GITHUB_WORKSPACE/docker/Dockerfile" /tmp/docker.tmp.aarch64/
          sudo tar -xpf /tmp/rootfs-aarch64/kreato-linux-${{ matrix.image }}-aarch64-*.tar.gz -C /tmp/docker.tmp.aarch64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        run: |
          echo "$CR_PAT" | docker login ghcr.io -u kreatolinux --password-stdin
        env:
          CR_PAT: ${{ secrets.CR_PAT }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push amd64 image
        if: ${{ !inputs.arm64Only }}
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.amd64
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/kreatolinux/${{ matrix.image }}:amd64,kreato/${{ matrix.dockerhub }}:amd64

      - name: Push aarch64 image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/docker.tmp.aarch64
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ghcr.io/kreatolinux/${{ matrix.image }}:aarch64,kreato/${{ matrix.dockerhub }}:aarch64

      - name: Create and push multiarch manifests
        env:
          AMD64_BUILT: ${{ !inputs.arm64Only }}
          GHCR_IMAGE: ghcr.io/kreatolinux/${{ matrix.image }}
          DOCKERHUB_IMAGE: kreato/${{ matrix.dockerhub }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            if [ "$AMD64_BUILT" = "true" ]; then
              AMD64_REF="$image:amd64"
            else
              # ARM64-only runs preserve the AMD64 platform from :latest.
              docker manifest inspect "$image:latest" > /tmp/latest.json
              AMD64_REF=$(jq -er --arg image "$image" 'if .manifests then ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | $image + "@" + .digest] | .[0]) else $image + ":latest" end' /tmp/latest.json)
            fi
            docker manifest create "$image:latest" \
              --amend "$AMD64_REF" \
              --amend "$image:aarch64"
            docker manifest push "$image:latest"
          done
